<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Confirmed — Hannah Barron Outdoors</title>
  <script src="data.js"></script>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body {
      background: var(--ink-950);
      color: var(--bone-50);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .success-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 96px 32px;
      text-align: center;
      max-width: 640px;
      margin: 0 auto;
    }
    .success-eyebrow {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 0.78rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--rust-400);
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 36px;
    }
    .success-eyebrow::before {
      content: '';
      width: 56px; height: 1px;
      background: var(--rust-500);
    }
    .success-mark {
      width: 80px; height: 80px;
      margin-bottom: 32px;
      background: var(--moss-600);
      color: var(--bone-50);
      display: grid;
      place-items: center;
      animation: popIn 600ms var(--ease-out) forwards;
    }
    @keyframes popIn {
      from { transform: scale(0.6); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .success-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      letter-spacing: -0.025em;
      line-height: 0.95;
      text-transform: uppercase;
      color: var(--bone-50);
      margin-bottom: 24px;
    }
    .success-sub {
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--bone-300);
      max-width: 48ch;
      margin-bottom: 48px;
    }
    .success-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="success-wrap">
    <div class="success-eyebrow">Order Confirmed</div>
    <div class="success-mark">
      <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1 class="success-title">Order<br/>Confirmed</h1>
    <p class="success-sub">
      Thanks for your purchase. A confirmation email is on its way from Stripe.
      We'll get your gear shipped soon.
    </p>
    <div class="success-actions">
      <a href="store.html" class="btn btn-primary btn-lg">Keep Shopping</a>
      <a href="index.html" class="btn btn-outline btn-lg">Back Home</a>
    </div>
  </div>
  <script>
    localStorage.removeItem('hb_cart');
  </script>
</body>
</html>
